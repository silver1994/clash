# BPI-R4 / 4GB / OpenClash v0.48.002 / alpha-smart-gdaf3ad0
# 使用前：把下方 url 的 ### 换成真实订阅地址；原文件不被覆盖。
# 保留下载规则中的 IBKR / interactivebrokers / Apple / blz 直连例外。
# OpenClash 会覆写部分 DNS、嗅探与 TUN 参数，请同时阅读配套说明。

proxy-providers:
  blueberry:
    url: "###"
    type: http
    path: ./proxy_provider/blueberry.yaml
    interval: 86400
    proxy: 直连
    health-check:
      enable: true
      url: &test_url https://www.gstatic.com/generate_204
      interval: 300
      timeout: 5000
      lazy: true
      expected-status: 204

proxies:
  - {name: 直连, type: direct}

mode: rule
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
allow-lan: true
bind-address: "*"
ipv6: false
unified-delay: true
tcp-concurrent: true
log-level: warning
find-process-mode: 'off'
keep-alive-idle: 600
keep-alive-interval: 15
profile:
  store-selected: true
  store-fake-ip: true

# 保留原有嗅探能力、端口和例外。
sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
  skip-domain:
    - "+.baidu.com"

# OpenClash 管理路由和防火墙；不让内核再创建另一套自动路由。
# 实际 TUN 开关和协议栈以 OpenClash 面板生成的运行配置为准。
tun:
  enable: true
  stack: mixed
  dns-hijack: ["any:53", "tcp://any:53"]
  auto-route: false
  auto-redirect: false
  auto-detect-interface: false

dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "rule-set:private_domain,cn_domain"
    - "rule-set:steam_download_cn,steam_download"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.*.com"
    - "+.market.xiaomi.com"
  default-nameserver:
    - 223.5.5.5
  # 节点域名先走直连 DNS，避免解析节点时依赖节点自身。
  proxy-server-nameserver:
    - "https://223.5.5.5/dns-query#DIRECT"
  # 国内域名和直连出口保留原来的运营商 / 阿里 DNS。
  nameserver-policy:
    "rule-set:private_domain,cn_domain": &cn_dns
      - 218.2.2.2
      - 223.5.5.5
    # 下载使用国内解析，帮助 Steam 选择本地 CDN；不绑定易变的上海 IP。
    "rule-set:steam_download_cn,steam_download": *cn_dns
  direct-nameserver: *cn_dns
  # 其余真实解析经默认代理请求 DoH；不依赖国内明文 DNS 解析境外域名。
  nameserver:
    - "https://1.1.1.1/dns-query#🚀 默认代理"
    - "https://8.8.8.8/dns-query#🚀 默认代理"

# 仅用于 YAML 复用；统一测速 URL，让 provider 复用同一份健康检查。
group-anchor:
  node: &node
    include-all-providers: true
    exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败"
    # 某地区无节点时明确拒绝，避免空组回退为直连。
    empty-fallback: REJECT
  auto: &auto
    <<: *node
    type: url-test
    url: *test_url
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
    tolerance: 50
  fallback: &fallback
    <<: *node
    type: fallback
    url: *test_url
    interval: 300
    timeout: 5000
    lazy: true
    expected-status: 204
  manual: &manual
    <<: *node
    type: select
    exclude-filter: "(?i)官网|套餐|剩余|订阅|流量|到期|过期|邮箱|失败"

proxy-groups:
  # 自动组按节点名称筛选地区；不等同于实际出口地区或服务解锁检测。
  - {<<: *auto, name: "⚡ 全球自动"}
  - {<<: *auto, name: "⚡ 亚洲自动", filter: "(?i)港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰|[台臺]|tai[ -]?wan|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼|日|japan|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵|新加坡|坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬|韩|韓|korea|(?:^|[^a-z])kr(?:[^a-z]|$)|🇰🇷"}
  - {<<: *auto, name: "⚡ 香港自动", filter: "(?i)港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰"}
  - {<<: *auto, name: "⚡ 台湾自动", filter: "(?i)[台臺]|tai[ -]?wan|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼"}
  - {<<: *auto, name: "⚡ 日本自动", filter: "(?i)日|japan|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵"}
  - {<<: *auto, name: "⚡ 狮城自动", filter: "(?i)新加坡|坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬"}
  - {<<: *auto, name: "⚡ 美国自动", filter: "(?i)美|united[ -]?states|america|(?:^|[^a-z])us(?:[^a-z]|$)|🇺🇸|🇺🇲"}
  - {<<: *auto, name: "⚡ 非港自动", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰"}
  - {<<: *auto, name: "⚡ 游戏自动", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|[台臺]|tai[ -]?wan|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼"}

  # 所有业务组共用同一套选项和顺序；每组仍可独立选择，也可直接选择订阅节点。
  - {<<: *manual, name: "🚀 默认代理", proxies: &p_main ["⚡ 全球自动", "⚡ 亚洲自动", "⚡ 香港自动", "⚡ 台湾自动", "⚡ 日本自动", "⚡ 狮城自动", "⚡ 美国自动", "⚡ 非港自动", "⚡ 游戏自动", "🔯 香港故转", "🔯 台湾故转", "🔯 日本故转", "🔯 狮城故转", "🔯 美国故转", "🔯 AI故转", "🇭🇰 香港节点", "🇹🇼 台湾节点", "🇯🇵 日本节点", "🇸🇬 狮城节点", "🇺🇲 美国节点", "🌐 全部节点", "🌐 非港节点", "🌐 游戏节点", "直连"]}
  - {<<: *manual, name: "📹 YouTube", proxies: *p_main}
  - {<<: *manual, name: "🍀 Google", proxies: *p_main}
  - {<<: *manual, name: "👨🏿‍💻 GitHub", proxies: *p_main}
  - {<<: *manual, name: "📲 Telegram", proxies: *p_main}
  - {<<: *manual, name: "🤖 ChatGPT", proxies: *p_main}
  - {<<: *manual, name: "✨ gemini", proxies: *p_main}
  - {<<: *manual, name: "💹 美股分流", proxies: *p_main}
  - {<<: *manual, name: "🎵 TikTok", proxies: *p_main}
  - {<<: *manual, name: "💶 PayPal", proxies: *p_main}
  - {<<: *manual, name: "🐬 OneDrive", proxies: *p_main}
  - {<<: *manual, name: "🪟 Microsoft", proxies: *p_main}
  - {<<: *manual, name: "🎮 steam", proxies: *p_main}
  - {<<: *manual, name: "❄️ blizzard", proxies: *p_main}
  - {<<: *manual, name: "🏎️ F1", proxies: *p_main}
  - {<<: *manual, name: "🍄 NINTENDO", proxies: *p_main}
  - {<<: *manual, name: "🎥 NETFLIX", proxies: *p_main}
  # 保留旧组名称供面板兼容；最终 MATCH 已固定直连，不再引用此组。
  - {<<: *manual, name: "🐟 漏网之鱼", proxies: *p_main}

  # 手动地区选择与原有故障切换组。故转保持订阅顺序，去掉无效 tolerance。
  - {<<: *manual, name: "🇭🇰 香港节点", filter: "(?i)港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰", proxies: ["⚡ 香港自动", "直连"]}
  - {<<: *manual, name: "🇹🇼 台湾节点", filter: "(?i)[台臺]|tai[ -]?wan|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼", proxies: ["⚡ 台湾自动", "直连"]}
  - {<<: *manual, name: "🇯🇵 日本节点", filter: "(?i)日|japan|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵", proxies: ["⚡ 日本自动", "直连"]}
  - {<<: *manual, name: "🇸🇬 狮城节点", filter: "(?i)新加坡|坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬", proxies: ["⚡ 狮城自动", "直连"]}
  - {<<: *manual, name: "🇺🇲 美国节点", filter: "(?i)美|united[ -]?states|america|(?:^|[^a-z])us(?:[^a-z]|$)|🇺🇸|🇺🇲", proxies: ["⚡ 美国自动", "直连"]}
  - {<<: *fallback, name: "🔯 香港故转", filter: "(?i)港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|专线"}
  - {<<: *fallback, name: "🔯 台湾故转", filter: "(?i)[台臺]|tai[ -]?wan|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|专线"}
  - {<<: *fallback, name: "🔯 日本故转", filter: "(?i)日|japan|(?:^|[^a-z])jp(?:[^a-z]|$)|🇯🇵", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|专线"}
  - {<<: *fallback, name: "🔯 狮城故转", filter: "(?i)新加坡|坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|专线"}
  - {<<: *fallback, name: "🔯 美国故转", filter: "(?i)美|united[ -]?states|america|(?:^|[^a-z])us(?:[^a-z]|$)|🇺🇸|🇺🇲", exclude-filter: "(?i)官网|套餐|剩余|直连|订阅|流量|到期|过期|邮箱|失败|专线"}
  - {<<: *fallback, name: "🔯 AI故转", filter: "(?i)新加坡|坡|狮城|獅城|singapore|(?:^|[^a-z])sg(?:[^a-z]|$)|🇸🇬"}
  - {<<: *manual, name: "🌐 全部节点", proxies: ["⚡ 全球自动", "直连"]}
  - {<<: *manual, name: "🌐 非港节点", proxies: ["⚡ 日本自动", "直连"], exclude-filter: "(?i)官网|套餐|剩余|订阅|流量|到期|过期|邮箱|失败|港|hong[ -]?kong|(?:^|[^a-z])hk(?:[^a-z]|$)|🇭🇰"}
  - {<<: *manual, name: "🌐 游戏节点", proxies: ["⚡ 游戏自动", "直连"], exclude-filter: "(?i)官网|套餐|剩余|订阅|流量|到期|过期|邮箱|失败|[台臺]|tai[ -]?wan|(?:^|[^a-z])tw(?:[^a-z]|$)|🇹🇼"}

# 保留明确的直连例外，再匹配业务域名，最后才使用通用代理 / IP 兜底。
# download 内含 IBKR / interactivebrokers / Apple / blz 直连，按你的要求仍优先。
rules:
  - RULE-SET,private_domain,直连
  - RULE-SET,private_ip,直连,no-resolve
  - RULE-SET,download,直连
  - RULE-SET,steamcn,直连
  - RULE-SET,steam_download_cn,直连
  - AND,((RULE-SET,steam_download),(RULE-SET,cn_ip)),直连
  - RULE-SET,steam,🎮 steam
  - DOMAIN-SUFFIX,cn,直连
  - RULE-SET,binance,直连
  - RULE-SET,cn_domain,直连
  - RULE-SET,PlayStation / Domain,直连
  - RULE-SET,apple_domain,直连
  - RULE-SET,apple_ip,直连,no-resolve
  # 业务域名优先，避免被通用代理规则截走。
  - RULE-SET,gemini,✨ gemini
  - RULE-SET,ibkr,💹 美股分流
  - RULE-SET,schwab,💹 美股分流
  - RULE-SET,F1,🏎️ F1
  - RULE-SET,blizzard,❄️ blizzard
  - RULE-SET,NINTENDO,🍄 NINTENDO
  - RULE-SET,ai,🤖 ChatGPT
  - RULE-SET,github_domain,👨🏿‍💻 GitHub
  - RULE-SET,youtube_domain,📹 YouTube
  - RULE-SET,google_domain,🍀 Google
  - RULE-SET,onedrive_domain,🐬 OneDrive
  - RULE-SET,microsoft_domain,🪟 Microsoft
  - RULE-SET,tiktok_domain,🎵 TikTok
  - RULE-SET,telegram_domain,📲 Telegram
  - RULE-SET,netflix_domain,🎥 NETFLIX
  - RULE-SET,paypal_domain,💶 PayPal
  # 通用代理域名。
  - RULE-SET,discord_domain,🚀 默认代理
  - DOMAIN-SUFFIX,qichiyu.com,🚀 默认代理
  - RULE-SET,proxylite,🚀 默认代理
  - RULE-SET,x_domain,🚀 默认代理
  - RULE-SET,amazon,🚀 默认代理
  - RULE-SET,geolocation-!cn,🚀 默认代理
  # 剩余连接再判断目标 IP，减少域名分流前的无谓 DNS 查询。
  - RULE-SET,private_ip,直连
  - RULE-SET,cn_ip,直连
  - RULE-SET,google_ip,🍀 Google,no-resolve
  - RULE-SET,netflix_ip,🎥 NETFLIX,no-resolve
  - RULE-SET,telegram_ip,📲 Telegram,no-resolve
  - RULE-SET,Globe / Domain,🚀 默认代理
  - RULE-SET,guowai,🚀 默认代理
  # NAS / PT：所有未命中前面规则的连接固定直连。
  - MATCH,直连

# 规则下载固定经过默认代理，避免 raw.githubusercontent.com 直连失败。
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs, proxy: "🚀 默认代理"}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs, proxy: "🚀 默认代理"}
  class: &class {type: http, interval: 86400, behavior: classical, format: text, proxy: "🚀 默认代理"}
